name: landslide-webgis
services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: landslide_webgis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
      LANDSLIDE_OWNER_PASSWORD: ${LANDSLIDE_OWNER_PASSWORD:?Set a migration password}
      LANDSLIDE_APP_PASSWORD: ${LANDSLIDE_APP_PASSWORD:?Set an application password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - landslide_data:/var/lib/postgresql/data
      - ./bootstrap.sql:/docker-entrypoint-initdb.d/20-landslide.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d landslide_webgis"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  landslide_data:
